name: No solutions in student materials

# Scans the whole branch rather than one push range, so it also catches commits
# that arrive by a force-push or a rewritten branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan student notebooks for solution markers
        run: python3 scripts/check_no_solutions.py
      - name: Scan history for nbgitpuller commits touching student materials
        run: python3 scripts/watch_nbgitpuller.py HEAD
